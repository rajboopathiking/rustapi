[package]
name = "rustapi"
version = "0.1.17"
edition = "2021"
description = "A FastAPI-style Python web framework with a Rust tokio/hyper core, plus a built-in MCP server (JSON-RPC over Streamable HTTP)."
license = "MIT"
readme = "README.md"

[lib]
# Compiled extension module name; the Python wrapper package (python/rustapi/__init__.py)
# imports from this and re-exports a clean public API.
name = "_rustapi"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
hyper = { version = "0.14", features = ["full"] }
serde_json = "1"
urlencoding = "2"
notify = "6"
socket2 = { version = "0.5", features = ["all"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
