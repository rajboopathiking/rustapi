name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Run Pytest Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install build tools and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-asyncio pydantic httpx requests minijinja argon2-cffi PyJWT pyyaml numpy pillow

      - name: Build locked release wheel
        run: |
          maturin build --release --locked --out dist

      - name: Install wheel
        run: |
          pip install dist/*.whl --force-reinstall

      - name: Smoke test installed wheel outside source checkout
        run: |
          mkdir -p /tmp/smoketest
          cd /tmp/smoketest
          python -c "import tomllib, rustapi; print('Installed rustapi from:', rustapi.__file__); assert 'site-packages' in rustapi.__file__; meta = tomllib.load(open('${{ github.workspace }}/pyproject.toml', 'rb')); assert rustapi.__version__ == meta['project']['version']"
          python -c "from rustapi import FastAPI, Depends, ResponseValidationError; app = FastAPI(); print('All symbols verified successfully')"

      - name: Run test suite
        run: |
          pytest -v
