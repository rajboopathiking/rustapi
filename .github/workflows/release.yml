name: Build and Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  # ---------------------------------------------------
  # STAGE 1: Build Source Distribution (sdist)
  # ---------------------------------------------------
  build-sdist:
    name: Build Source Distribution (sdist)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Save sdist as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  # ---------------------------------------------------
  # STAGE 2: Build Wheels on all Operating Systems & Architectures
  # ---------------------------------------------------
  build-wheels:
    name: Build Wheels (${{ matrix.platform.os }} - ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || '' }}
          command: build
          args: --release --out dist

      - name: Save Wheels as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist

  # ---------------------------------------------------
  # STAGE 3: Test Gate (Require passing tests before publish)
  # ---------------------------------------------------
  test:
    name: Test Gate Verification
    needs: [build-wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Linux x86_64 wheel
        uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest-x86_64
          path: dist

      - name: Install test dependencies and built wheel
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pydantic httpx requests minijinja argon2-cffi PyJWT pyyaml numpy pillow
          pip install dist/*.whl --force-reinstall

      - name: Verify installed version
        run: |
          python -c "import rustapi; print('RustAPI version:', rustapi.__version__); assert rustapi.__version__ == '1.9.0b4'"

      - name: Run full test suite
        run: |
          pytest -v

  # ---------------------------------------------------
  # STAGE 4: Publish all collected wheels & sdist to PyPI
  # ---------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: [test, build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyrustapi
    permissions:
      id-token: write
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '*'
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
          skip-existing: true
