name: Build and Publish to PyPI

# `release.yml` - Build wheels on multiple OSes, collect artifacts, then publish to PyPI
on:
  push:
    tags:
      - 'v*'

# ---------------------------------------------------
# STAGE 1: Build the Wheels on all Operating Systems
# ---------------------------------------------------
jobs:
  build-wheels:
    name: Build Wheels (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Build Wheels (No virtualenv required)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          command: build
          args: --release --out dist

      - name: Save Wheels as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist

# ---------------------------------------------------
# STAGE 2: Publish all collected wheels to PyPI
# ---------------------------------------------------
  # ---------------------------------------------------
  # STAGE 2: Publish all collected wheels to PyPI
  # ---------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest

    steps:
      - name: Download all built wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}  # ✅ Added this line to use your secret!
