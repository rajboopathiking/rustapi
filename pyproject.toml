[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pyrustapi"
version = "0.8.6"
description = "A FastAPI-style Python web framework with a Rust tokio/hyper core, and a built-in MCP server."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Boopathi Raj" }]
keywords = ["web", "framework", "rust", "pyo3", "fastapi", "mcp", "asgi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Intended Audience :: Developers",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "requests>=2.28", "pytest-html>=4.0"]

[tool.pytest.ini_options]
# Store built-in test output artefacts under test-reports/
addopts = [
    "-v",
    "--tb=short",
    "--junitxml=test-reports/junit.xml",
]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/rajboopathiking/rustapi"
Repository = "https://github.com/rajboopathiking/rustapi"
Issues = "https://github.com/rajboopathiking/rustapi/issues"

[tool.maturin]
python-source = "python"
python-packages = ["rustapi", "pyrustapi"]
module-name = "rustapi._rustapi"
features = ["pyo3/extension-module"]
