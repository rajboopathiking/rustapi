[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rustapi"
version = "0.1.0"
description = "A FastAPI-style Python web framework with a Rust (tokio/hyper) core"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["web", "framework", "rust", "async", "http", "api", "fastapi", "pyo3"]
authors = [
    { name = "Your Name", email = "you@example.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/yourusername/rustapi"
Repository = "https://github.com/yourusername/rustapi"
Issues = "https://github.com/yourusername/rustapi/issues"
Changelog = "https://github.com/yourusername/rustapi/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7.0", "requests>=2.28"]

[tool.maturin]
module-name = "rustapi"
strip = true
